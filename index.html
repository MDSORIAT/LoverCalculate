<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Simple BMI Calculator</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 50px;
      }
      .box {
        display: inline-block;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 10px;
      }
      input {
        margin: 10px 0;
        padding: 8px;
        width: 200px;
      }
      button {
        padding: 10px 15px;
        background: green;
        color: white;
        border: none;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>BMI Calculator</h2>
      <label>Weight (kg):</label><br />
      <input type="number" id="weight" placeholder="Enter weight" /><br />

      <label>Height (cm):</label><br />
      <input type="number" id="height" placeholder="Enter height" /><br />

      <button onclick="calculate()">Calculate</button>

      <h3 id="result"></h3>
    </div>

    <script src="script.js"></script>
  </body>
</html>
