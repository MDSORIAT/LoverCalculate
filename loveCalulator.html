<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Calculator</title>
    <style>
      /* This css style from google AI */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
      }

      /* Center everything with a romantic gradient background */
      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
      }

      /* Glassmorphism Card Style */
      .love-card {
        background: rgba(255, 255, 255, 0.9);
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        width: 380px;
        text-align: center;
        backdrop-filter: blur(10px);
      }

      .love-card h1 {
        color: #d63384;
        font-size: 24px;
        margin-bottom: 5px;
      }

      .subtitle {
        color: #666;
        font-size: 13px;
        margin-bottom: 25px;
      }

      /* Form Inputs Styling */
      .input-group {
        text-align: left;
        margin-bottom: 20px;
      }

      .input-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #444;
        margin-bottom: 6px;
      }

      .input-group input {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #ffd1dc;
        border-radius: 10px;
        outline: none;
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .input-group input:focus {
        border-color: #ff477e;
        box-shadow: 0 0 8px rgba(255, 71, 126, 0.3);
      }

      /* Romantic Gradient Button */
      .love-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #ff477e, #ff70a6);
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 4px 15px rgba(255, 71, 126, 0.4);
      }

      .love-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 71, 126, 0.6);
      }

      .love-btn:active {
        transform: translateY(0);
      }

      /* Result Area */
      #result {
        margin-top: 25px;
        font-size: 18px;
        color: #b10046;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="love-card">
      <h1>❤️ Love Calculator ❤️</h1>
      <p class="subtitle">Find your true compatibility match!</p>

      <form id="loveForm">
        <div class="input-group">
          <label for="person1">Your Name:</label>
          <input type="text" id="person1" placeholder="e.g., Romeo" required />
        </div>

        <div class="input-group">
          <label for="person2">Crush's Name:</label>
          <input type="text" id="person2" placeholder="e.g., Juliet" required />
        </div>

        <button type="submit" class="love-btn" onclick="calculate(event)">
          Calculate Love
        </button>
      </form>

      <h2 id="result"></h2>
    </div>

    <script src="loveCalulate.js"></script>
  </body>
</html>
